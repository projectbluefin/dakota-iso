name: Publish Utah installer medium

# Publishes Utah's gnome-setup medium (image-installer/utah/) to
# projectbluefin.dev, the download that replaces the fisherman live ISO
# (projectbluefin/utah#1569, the owner decision that Utah installs with
# upstream gnome-setup):
#
#   1. resolve and signature-verify ghcr.io/projectbluefin/utah:stable;
#   2. run the whole GUI E2E (utah-image-installer.yml) on that exact digest;
#   3. only if it passes, build the medium again with no test credentials,
#      bake the Flatpaks, shrink it, compress it (xz), sign its checksum
#      keylessly and upload it to R2 as utah-installer-latest.raw.xz,
#      rotating three backups the way build-iso-utah.yml does. xz because
#      Fedora Media Writer, GNOME Disks and Impression decompress only .xz
#      (they would write zstd-compressed bytes to the stick as is);
#   4. the E2E also boots the live stage from the hybrid ISO
#      (build-hybrid-iso.sh, projectbluefin/utah#1404) as a CD-ROM and as a
#      USB disk, and the publish job builds that ISO from the same medium and
#      uploads it uncompressed as utah-installer-latest.iso (Fedora Media
#      Writer writes ISOs as is), signed and rotated like the raw.xz. Secure
#      Boot off until a signed chain lands (projectbluefin/utah#1380).
#
# The iso flag is on for schedules and by default on dispatch; dispatch with
# iso=false to test and publish the raw.xz alone.
#
# Monthly on the 8th like the Utah ISO, and on dispatch from main.
on:
  schedule:
    - cron: '0 5 8 * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: Build, test and sign, but do not upload to R2 (dry run)
        type: boolean
        default: false
      iso:
        description: Also E2E (CD-ROM and USB disk) and publish the hybrid ISO; false = raw.xz only
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-utah-installer
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      # The one switch for the ISO: its E2E legs and its publication. Null on schedule = on.
      iso: ${{ inputs.iso != false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - id: pin
        run: |
          set -euo pipefail
          ref="$(scripts/verify-image-signature.sh ghcr.io/projectbluefin/utah:stable)"
          [[ "$ref" =~ ^ghcr\.io/projectbluefin/utah@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::unexpected pinned reference: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/utah-image-installer.yml
    with:
      image_ref: ${{ needs.resolve.outputs.ref }}
      iso: ${{ needs.resolve.outputs.iso == 'true' }}

  publish:
    needs: [resolve, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write  # keyless cosign signing of the checksum
    env:
      WORK: /mnt/publish
      SOURCE_REF: ${{ needs.resolve.outputs.ref }}
      LATEST_NAME: utah-installer-latest.raw.xz
      ISO_NAME: utah-installer-latest.iso
      ISO: ${{ needs.resolve.outputs.iso }}
      BASE: utah-installer
      RAW: image-installer/utah/iso/raw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Prepare host (podman storage and work dir on /mnt)
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          # build-hybrid-iso.sh's "# Host tools:" are stock here (util-linux, coreutils,
          # diffutils, python3, udev); systemd-repart and systemd-boot come from the medium.
          sudo apt-get install -y podman skopeo qemu-utils xz-utils rclone
          sudo mkdir -p /mnt/containers /var/lib/containers "$WORK"
          sudo mount --bind /mnt/containers /var/lib/containers
          sudo chown "$USER" "$WORK"
      - name: Build the live-capable image layer
        timeout-minutes: 60
        run: |
          set -euo pipefail
          sudo podman pull -q "$SOURCE_REF"
          sudo podman build --layers=false -t localhost/utah-publish:ci \
            --build-arg SOURCE_IMAGE="$SOURCE_REF" -f "$RAW/Containerfile" "$RAW" 2>&1 | tail -150
      # ADR-0001 decision 6: Flatpaks live on the medium's stateful /var only.
      - name: Assert the published image and the live layer carry no Flatpaks
        run: |
          set -euo pipefail
          for ref in "$SOURCE_REF" localhost/utah-publish:ci; do
            sudo podman run --rm --entrypoint sh "$ref" -c \
              'test ! -e /var/lib/flatpak || test -z "$(ls -A /var/lib/flatpak)"' \
              || { echo "::error::$ref has content in /var/lib/flatpak"; exit 1; }
          done
      - name: Build the clean medium (no test credentials, no debug kargs)
        run: |
          set -euo pipefail
          # Installed systems track :stable, the tag this medium was built from.
          sudo UTAH_RAW_EVIDENCE="$WORK/raw-evidence" \
            bash "$RAW/build-raw-image.sh" localhost/utah-publish:ci "$WORK/medium.raw" ghcr.io/projectbluefin/utah:stable
      - name: Bake the Flatpaks and shrink the medium
        run: |
          set -euo pipefail
          ev="$WORK/raw-evidence"
          sudo env UTAH_RAW_EVIDENCE="$ev" bash "$RAW/bake-flatpaks.sh" localhost/utah-publish:ci "$WORK/medium.raw"
          sudo env UTAH_RAW_EVIDENCE="$ev" UTAH_RAW_BTRFS_COMPRESS="zstd:3" \
            bash "$RAW/shrink-raw-image.sh" localhost/utah-publish:ci "$WORK/medium.raw"
          sudo chown "$USER" "$WORK/medium.raw"
          sudo podman rmi -af >/dev/null || true
      # Before the raw is compressed and removed: the ISO block-copies its partitions.
      - name: Build the hybrid ISO from the medium
        if: env.ISO == 'true'
        run: |
          set -euo pipefail
          sudo env UTAH_RAW_EVIDENCE="$WORK/raw-evidence" \
            bash "$RAW/build-hybrid-iso.sh" "$WORK/medium.raw" "$WORK/$ISO_NAME"
          sudo chown "$USER" "$WORK/$ISO_NAME"
      - name: Compress, checksum and sign
        run: |
          set -euo pipefail
          xz -T0 -6 -c "$WORK/medium.raw" > "$WORK/$LATEST_NAME"
          rm -f "$WORK/medium.raw"
          cd "$WORK"
          sha256sum "$LATEST_NAME" > "$LATEST_NAME-CHECKSUM"
          cosign sign-blob --yes --bundle "$LATEST_NAME-CHECKSUM.sigstore.json" "$LATEST_NAME-CHECKSUM"
          echo "medium: $(du -h "$LATEST_NAME" | cut -f1), from $SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Checksum and sign the ISO (uncompressed)
        if: env.ISO == 'true'
        run: |
          set -euo pipefail
          cd "$WORK"
          sha256sum "$ISO_NAME" > "$ISO_NAME-CHECKSUM"
          cosign sign-blob --yes --bundle "$ISO_NAME-CHECKSUM.sigstore.json" "$ISO_NAME-CHECKSUM"
          echo "ISO: $(du -h "$ISO_NAME" | cut -f1), from $SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to Cloudflare R2
        if: inputs.skip_upload != true
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          cd "$WORK"
          FILES="$(rclone lsf R2:testing --files-only || true)"
          exists() { grep -Fxq "$1" <<<"$FILES"; }
          move_if_exists() {
            if exists "$1"; then
              rclone moveto --log-level INFO --s3-no-check-bucket "R2:testing/$1" "R2:testing/$2"
            fi
          }
          # publish NAME EXT: rotate NAME's three backups ($BASE-backup-N.EXT,
          # with its -CHECKSUM and -CHECKSUM.sigstore.json), then upload NAME.
          published=()
          publish() {
            local latest="$1" ext="$2" n suffix
            for n in 2 1; do
              for suffix in "" -CHECKSUM -CHECKSUM.sigstore.json; do
                move_if_exists "$BASE-backup-$n.$ext$suffix" "$BASE-backup-$((n + 1)).$ext$suffix"
              done
            done
            for suffix in "" -CHECKSUM -CHECKSUM.sigstore.json; do
              move_if_exists "$latest$suffix" "$BASE-backup-1.$ext$suffix"
            done
            for suffix in "" -CHECKSUM -CHECKSUM.sigstore.json; do
              rclone copyto --log-level INFO --s3-no-check-bucket "$latest$suffix" "R2:testing/$latest$suffix"
            done
            published+=("$latest")
          }
          publish "$LATEST_NAME" raw.xz
          if [[ "$ISO" == true ]]; then publish "$ISO_NAME" iso; fi
          {
            echo "## Published"
            for name in "${published[@]}"; do
              for suffix in "" -CHECKSUM -CHECKSUM.sigstore.json; do
                echo "- [$name$suffix](https://projectbluefin.dev/$name$suffix)"
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"
