name: Lint

on:
  pull_request:
  # The required checks must also run in the merge queue (shared baseline).
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: '.'
          ignore_paths: >
            .git

  pinned-fetches:
    name: Pinned fetches
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-pinned-fetches.yml@5b7d9119609508a908d8cba8dba9978135f78f76 # v1
    with:
      mode: warn
