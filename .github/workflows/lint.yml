name: Lint

on:
  pull_request:
  # The required checks must also run in the merge queue (shared baseline).
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: '.'
          ignore_paths: >
            .git

  pinned-fetches:
    name: Pinned fetches
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-pinned-fetches.yml@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
    with:
      mode: warn
