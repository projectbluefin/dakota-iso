name: Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Minimal Smoke Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install just
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8 (just)
        with:
          tool: just

      - name: Install test dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Validate scripts and recipes
        run: |
          just --dry-run test
          bash -n live/src/*.sh scripts/*.sh dakota/src/*.sh
