name: Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Minimal Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install just
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1 (just)
        with:
          tool: just

      - name: Install test dependencies
        run: pip install pytest PyYAML jsonschema

      - name: Validate scripts and recipes
        run: |
          just --dry-run test
          bash -n live/src/*.sh scripts/*.sh dakota/src/*.sh
