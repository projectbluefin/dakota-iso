name: Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Minimal Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3 (just)
        with:
          tool: just

      - name: Install test dependencies
        run: pip install pytest PyYAML jsonschema

      - name: Validate scripts and recipes
        run: |
          just --dry-run test
          bash -n live/src/*.sh scripts/*.sh dakota/src/*.sh
