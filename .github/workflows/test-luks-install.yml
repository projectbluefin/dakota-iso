name: LUKS Install End-to-End Test

# Test a full LUKS-encrypted installation via fisherman and verify the
# installed system can unlock and boot.  Mirrors the local just recipes:
#
#   just debug=1 installer_channel=dev iso-sd-boot dakota
#   just luks-test-qemu dakota
#
# Runs two parallel legs:
#   dev    — continuous-dev Flatpak (catches regressions before stable)
#   stable — continuous Flatpak    (verifies what users actually download)
#
# Reproduces: projectbluefin/dakota#270

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  schedule:
    # Run weekly on Monday 04:00 UTC
    - cron: '0 4 * * 1'
permissions: {}

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6 (just)
        with:
          tool: just

      - name: Install test dependencies
        run: pip install pytest PyYAML jsonschema

      - name: Run unit tests
        run: just test

  luks-e2e:
    needs: unit-tests
    name: LUKS E2E ${{ matrix.variant }} (${{ matrix.installer_channel }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # dakota-only: this repo ships the Dakota ISO. The `stable` and `lts`
        # legs are dormant, not deleted — re-add them to this list to revive.
        # variant: [dakota, stable, lts]
        variant: [dakota]
        installer_channel: [dev, stable]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Give the harness a wall-clock deadline 10 minutes before the job's
      # timeout so a hang exits 75 and the evidence uploads still run.
      - name: Set the job deadline
        env:
          TIMEOUT_MINUTES: "120"  # keep equal to this job's timeout-minutes
        run: echo "E2E_WALL_CLOCK_DEADLINE=$(( $(date +%s) + (TIMEOUT_MINUTES - 10) * 60 ))" >> "$GITHUB_ENV"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            just podman skopeo mtools xorriso squashfs-tools \
            qemu-system-x86 ovmf socat sshpass \
            imagemagick jq -qq

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Symlink Cosign for sudo access
        run: sudo ln -sf "$(command -v cosign)" /usr/local/bin/cosign

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure podman storage (intelligent driver selection)
        run: bash .github/scripts/configure_podman_storage.sh

      - name: Build debug ISO
        id: build
        run: |
          # Build on /var/iso-build (~119 GB free after free-disk-space).
          START=$(date +%s)
          sudo mkdir -p /var/iso-build
          mkdir -p output

          # Use just iso-sd-boot: bound OCI media + squashfs + ISO assembly.
          # debug=1 enables SSH for the LUKS install step below.
          # On ubuntu-26.04 sudo keeps the runner user's XDG_RUNTIME_DIR, so a
          # plain `sudo just` writes a root-owned just cache into the runner's
          # runtime dir; the next unprivileged `just` then fails with
          # "Permission denied (os error 13)" before the test starts. Unset it
          # for the build step, the same way build-iso.yml already does.
          sudo env -u XDG_RUNTIME_DIR just \
            debug=1 \
            installer_channel=${{ matrix.installer_channel }} \
            output_dir=/var/iso-build \
            iso-sd-boot ${{ matrix.variant }}

          sudo cp /var/iso-build/${{ matrix.variant }}-live.iso output/${{ matrix.variant }}-live.iso
          sudo chown -R "$USER:$(id -gn)" output/
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          echo "iso_size=$(stat -c%s output/${{ matrix.variant }}-live.iso 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Fix output directory ownership
        run: sudo chown -R "$USER:$(id -gn)" output/ 2>/dev/null || true

      - name: Run LUKS end-to-end test
        id: luks_test
        run: |
          START=$(date +%s)
          # Use the same pinned backend shipped in the live image.
          rc=0
          just luks-test-qemu ${{ matrix.variant }} ${{ matrix.installer_channel }} || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Convert and publish screenshots
        if: always()
        continue-on-error: true
        id: screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VARIANT: ${{ matrix.variant }}
          CHANNEL: ${{ matrix.installer_channel }}
        run: |
          # Make root-owned PPMs readable
          sudo chmod a+r /tmp/luks-screenshot-*.ppm /tmp/luks-unlock-snap.ppm 2>/dev/null || true

          shots=$(mktemp -d)
          for pair in live:live-boot plymouth:plymouth final:final-boot; do
            convert "/tmp/luks-screenshot-${pair%%:*}.ppm" "${shots}/${pair#*:}.png" 2>/dev/null || true
          done

          # The branch holds one parentless commit with only this run's
          # screenshots; every publish replaces it, so it never grows (#382).
          run_dir="luks-e2e/${RUN_ID}"
          leg_dir="${run_dir}/${VARIANT}/${CHANNEL}"
          bash .github/scripts/publish_screenshots.sh \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            ci-screenshots "$run_dir" "$leg_dir" "$shots"

          for pair in live-boot:live_url plymouth:plymouth_url final-boot:final_url; do
            label=${pair%%:*}
            [[ -f "${shots}/${label}.png" ]] || continue
            url="https://raw.githubusercontent.com/${REPO}/ci-screenshots/${leg_dir}/${label}.png"
            echo "${pair#*:}=${url}" >> "$GITHUB_OUTPUT"
            echo "Published ${label} → ${url}"
          done

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VARIANT:           ${{ matrix.variant }}
          LIVE_URL:          ${{ steps.screenshots.outputs.live_url }}
          PLYMOUTH_URL:      ${{ steps.screenshots.outputs.plymouth_url }}
          FINAL_URL:         ${{ steps.screenshots.outputs.final_url }}
          BUILD_S:           ${{ steps.build.outputs.duration }}
          LUKS_S:            ${{ steps.luks_test.outputs.duration }}
          ISO_BYTES:         ${{ steps.build.outputs.iso_size }}
          TEST_RESULT:       ${{ steps.luks_test.outcome }}
          INSTALLER_CHANNEL: ${{ matrix.installer_channel }}
        with:
          script: |
            const variant = process.env.VARIANT || 'dakota';
            const result  = process.env.TEST_RESULT || 'unknown';
            const channel = process.env.INSTALLER_CHANNEL || 'unknown';
            const pass    = result === 'success';
            const icon    = pass ? '✅' : '❌';
            const runUrl  = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const fmtDur = s => s ? `${Math.floor(s/60)}m ${s%60}s` : 'N/A';
            const fmtMiB = b => b ? `${(b/1024/1024).toFixed(0)} MiB` : 'N/A';

            const img = (url, alt) => url ? `**${alt}**\n![${alt}](${url})\n` : '';

            const body = [
              `## ${icon} LUKS End-to-End Test ${variant} (${channel}) — ${pass ? 'PASSED' : 'FAILED'}`,
              '',
              '| Step | Details |',
              '|------|---------|',
              `| ISO build | ${fmtMiB(process.env.ISO_BYTES)} · ${fmtDur(process.env.BUILD_S)} |`,
              `| LUKS E2E  | ${fmtDur(process.env.LUKS_S)} |`,
              `| Result    | ${icon} ${result} |`,
              '',
              img(process.env.LIVE_URL,     'Live boot'),
              img(process.env.PLYMOUTH_URL, 'Plymouth passphrase prompt'),
              img(process.env.FINAL_URL,    'Installed system (post-LUKS unlock)'),
              `<sub>[Workflow run](${runUrl})</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Write job summary
        if: always()
        run: |
          RESULT="${{ steps.luks_test.outcome }}"
          CHANNEL="${{ matrix.installer_channel }}"
          VARIANT="${{ matrix.variant }}"
          ICON=$( [ "$RESULT" = "success" ] && echo "✅" || echo "❌" )
          {
            echo "## ${ICON} LUKS End-to-End Test ${VARIANT} (${CHANNEL}) — ${RESULT}"
            echo ""
            echo "| Step | Value |"
            echo "|------|-------|"
            echo "| ISO size | $(numfmt --to=iec ${{ steps.build.outputs.iso_size }} 2>/dev/null || echo N/A) |"
            echo "| Build time | ${{ steps.build.outputs.duration }}s |"
            echo "| LUKS test time | ${{ steps.luks_test.outputs.duration }}s |"
            echo "| Exit code | ${{ steps.luks_test.outputs.exit_code || 'N/A' }} ($(source scripts/e2e-exit.sh; e2e_phase_name '${{ steps.luks_test.outputs.exit_code }}')) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload serial logs
        if: always()
        run: |
          sudo chmod a+r /tmp/dakota-qemu-*.log /tmp/luks-screenshot-deadline.ppm 2>/dev/null || true

      - name: Upload serial logs artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: luks-e2e-serial-logs-${{ matrix.variant }}-${{ matrix.installer_channel }}
          path: |
            /tmp/dakota-qemu-live-serial.log
            /tmp/dakota-qemu-installed-serial.log
            /tmp/luks-screenshot-deadline.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if LUKS test failed
        if: steps.luks_test.outcome == 'failure'
        run: |
          echo "::error::LUKS end-to-end test failed — see serial logs and screenshots above"
          exit 1
