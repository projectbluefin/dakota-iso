---
# Test a plain (unencrypted) composefs+systemd-boot installation via fisherman
# and verify the installed system boots to the graphical target.
#
# This is the primary regression guard for installer crashes.  Running with
# qemu-mem=4096 (4 GiB) keeps the dracut overlay tmpfs tight (~2 GiB), which
# reliably reproduces ENOSPC-class bugs (e.g. containers/storage writing blobs
# to /var/tmp instead of the disk-backed scratch dir).
#
# Runs two parallel legs:
#   dev    — continuous-dev Flatpak (catches regressions before stable)
#   stable — continuous Flatpak    (verifies what users actually download)
#
# Reported crash this test guards against:
#   https://github.com/ublue-os/bluefin/discussions/4754

name: Plain Install E2E

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # The merge queue runs the stable leg, so a change that breaks the live ISO
  # build or the install (a Renovate base-image bump in live/Containerfile, for
  # example) is caught before it lands. Pull requests only report the gate, so
  # the PR can enter the queue; the E2E itself runs in the queue (#347).
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      installer_channel:
        description: 'Installer channel to test (dev or stable)'
        required: false
        default: ''
  schedule:
    # Run weekly on Tuesday 04:00 UTC (staggered from the LUKS test on Monday)
    - cron: '0 4 * * 2'
permissions: {}

jobs:
  unit-tests:
    name: Python Unit Tests
    # test.yml runs the unit tests on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4 (just)
        with:
          tool: just
      - run: pip install pytest PyYAML jsonschema
      - run: just test

  plain-e2e:
    needs: unit-tests
    name: Plain E2E ${{ matrix.variant }} (${{ matrix.installer_channel }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # dakota-only: this repo ships the Dakota ISO. The `stable` and `lts`
        # legs are dormant, not deleted — re-add them to this list to revive.
        # variant: [dakota, stable, lts]
        variant: [dakota]
        # The merge queue runs only the stable leg: the dev leg tests the
        # upstream continuous-dev Flatpak, not this repo, and a break there
        # must not block every merge.
        installer_channel: ${{ github.event_name == 'merge_group' && fromJSON('["stable"]') || fromJSON('["dev", "stable"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf sshpass socat imagemagick \
            libguestfs-tools just

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo adduser "$USER" kvm || true

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure podman storage (intelligent driver selection)
        run: bash .github/scripts/configure_podman_storage.sh

      - name: Build ISO
        id: build
        env:
          INSTALLER_CHANNEL: ${{ matrix.installer_channel }}
        run: |
          START=$SECONDS
          sudo apt-get install -y --no-install-recommends \
            podman skopeo squashfs-tools xorriso dosfstools mtools
          sudo mkdir -p /var/iso-build
          mkdir -p output
          # Prepare the single offline layout consumed by the shipped fisherman.
          PAYLOAD_IMAGE=$(cat ${{ matrix.variant }}/payload_ref | tr -d '[:space:]')
          sudo podman pull "$PAYLOAD_IMAGE"
          sudo -E bash scripts/build-live-squashfs.sh \
            --target ${{ matrix.variant }} \
            --installer-channel "$INSTALLER_CHANNEL" \
            --debug 1 \
            --oci-image "$PAYLOAD_IMAGE" \
            --output-dir /var/iso-build
          sudo bash scripts/build-iso.sh \
            --squashfs /var/iso-build/${{ matrix.variant }}-live.squashfs \
            --boot-tar /var/iso-build/${{ matrix.variant }}-boot-files.tar \
            --output /var/iso-build/${{ matrix.variant }}-live.iso
          sudo cp /var/iso-build/${{ matrix.variant }}-live.iso output/
          # The E2E test runs as the unprivileged user; make the ISO user-owned.
          sudo chown -R "$USER:$(id -gn)" output/
          ISO_SIZE=$(stat -c%s output/${{ matrix.variant }}-live.iso 2>/dev/null || echo 0)
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          echo "duration=$((SECONDS - START))" >> "$GITHUB_OUTPUT"
          echo "Built ISO: $(numfmt --to=iec "$ISO_SIZE")"

      - name: Run plain install E2E
        id: plain_test
        timeout-minutes: 60
        env:
          INSTALLER_CHANNEL: ${{ matrix.installer_channel }}
        run: |
          START=$SECONDS
          # 4096 MiB: tight overlay tmpfs to expose ENOSPC-class bugs
          # Use the same pinned backend shipped in the live image.
          just qemu-mem=4096 installer_channel="$INSTALLER_CHANNEL" plain-test-qemu ${{ matrix.variant }}
          echo "duration=$((SECONDS - START))" >> "$GITHUB_OUTPUT"

      - name: Capture serial logs and screenshot
        if: always()
        run: |
          sudo chmod a+r /tmp/dakota-plain-qemu-*.log 2>/dev/null || true
          ls -la /tmp/dakota-plain-qemu-* /tmp/plain-screenshot-final.ppm 2>/dev/null || true
          sudo chmod a+r /tmp/plain-screenshot-final.ppm 2>/dev/null || true
          # Convert screenshot for upload
          convert /tmp/plain-screenshot-final.ppm /tmp/plain-screenshot-final.png 2>/dev/null || true

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plain-e2e-serial-logs-${{ matrix.variant }}-${{ matrix.installer_channel }}
          path: |
            /tmp/dakota-plain-qemu-live-serial.log
            /tmp/dakota-plain-qemu-installed-serial.log
            /tmp/plain-screenshot-final.png
          if-no-files-found: warn
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting 403s; don't fail the job over it.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VARIANT:           ${{ matrix.variant }}
          TEST_RESULT:       ${{ steps.plain_test.outcome }}
          INSTALLER_CHANNEL: ${{ matrix.installer_channel }}
          BUILD_S:           ${{ steps.build.outputs.duration }}
          PLAIN_S:           ${{ steps.plain_test.outputs.duration }}
          ISO_BYTES:         ${{ steps.build.outputs.iso_size }}
        with:
          script: |
            const variant = process.env.VARIANT || 'dakota';
            const result  = process.env.TEST_RESULT || 'unknown';
            const channel = process.env.INSTALLER_CHANNEL || 'unknown';
            const pass    = result === 'success';
            const icon    = pass ? '✅' : '❌';
            const runUrl  = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fmtDur  = s => s ? `${Math.floor(s/60)}m ${s%60}s` : 'N/A';
            const fmtMiB  = b => b ? `${(b/1024/1024).toFixed(0)} MiB` : 'N/A';
            const body = [
              `## ${icon} Plain Install E2E ${variant} (${channel}) — ${pass ? 'PASSED' : 'FAILED'}`,
              '',
              '| Step | Details |',
              '|------|---------|',
              `| ISO build    | ${fmtMiB(process.env.ISO_BYTES)} · ${fmtDur(process.env.BUILD_S)} |`,
              `| Plain E2E    | ${fmtDur(process.env.PLAIN_S)} |`,
              `| QEMU RAM     | 4096 MiB (tight overlay tmpfs) |`,
              `| Result       | ${icon} ${result} |`,
              '',
              `<sub>[Workflow run](${runUrl})</sub>`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Write job summary
        if: always()
        env:
          RESULT: ${{ steps.plain_test.outcome }}
          CHANNEL: ${{ matrix.installer_channel }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ICON=$( [ "$RESULT" = "success" ] && echo "✅" || echo "❌" )
          {
            echo "## ${ICON} Plain Install E2E ${VARIANT} (${CHANNEL}) — ${RESULT}"
            echo ""
            echo "| Step | Value |"
            echo "|------|-------|"
            echo "| ISO size     | $(numfmt --to=iec ${{ steps.build.outputs.iso_size }} 2>/dev/null || echo N/A) |"
            echo "| Build time   | ${{ steps.build.outputs.duration }}s |"
            echo "| Plain E2E    | ${{ steps.plain_test.outputs.duration }}s |"
            echo "| QEMU RAM     | 4096 MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if plain test failed
        if: steps.plain_test.outcome == 'failure'
        run: |
          echo "::error::Plain install E2E failed — see serial logs above"
          echo "::error::Serial log tail:"
          ls /tmp/dakota-plain-qemu-*.log /tmp/plain-screenshot-final.png 2>/dev/null || true
          tail -30 /tmp/dakota-plain-qemu-installed-serial.log 2>/dev/null || true
          exit 1

  # One stable check name for the required checks. It passes on pull requests,
  # where the E2E is skipped, and in the merge queue it passes only when the
  # stable leg ran and passed.
  plain-e2e-gate:
    name: Plain E2E gate
    needs: [unit-tests, plain-e2e]
    # Only where it is a check: on push and schedule runs it would add a failed
    # job to a cancelled run, which ci-alert.yml counts.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the E2E results
        env:
          EVENT: ${{ github.event_name }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          PLAIN_E2E: ${{ needs.plain-e2e.result }}
        run: |
          set -euo pipefail
          for result in "$UNIT_TESTS" "$PLAIN_E2E"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "A Plain E2E dependency ended with $result" >&2
              exit 1
            fi
          done
          if [[ "$EVENT" == merge_group && "$PLAIN_E2E" != success ]]; then
            echo "Plain E2E did not run to success on $EVENT (result: $PLAIN_E2E)" >&2
            exit 1
          fi
          echo "Plain E2E gate passed on $EVENT (unit tests: $UNIT_TESTS, E2E: $PLAIN_E2E)"
