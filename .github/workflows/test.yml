name: Test

on:
  pull_request:
  # The required checks must also run in the merge queue (shared baseline).
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y xorriso dosfstools mtools squashfs-tools

      - name: Install Python dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          # Lets TestActionPinsResolve verify pinned action SHAs against the
          # GitHub API. Without a token the shared runner IP is rate limited and
          # the check silently skips.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
