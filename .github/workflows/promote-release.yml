---
name: Promote Named Release

# Creates a named R2 release (e.g. dakota-live-alpha6.iso) by server-side copying
# the current *-live-latest.iso objects. The `latest` pointer is only ever written
# by the publish workflows after their E2E gates pass, so promoting from it inherits
# that verification. See docs/r2-promotion.md.
#
# Server-side R2->R2 copies are used deliberately: direct uploads of multi-GB ISOs
# from outside the R2 network hang indefinitely (docs/r2-promotion.md, 2026-05).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which live ISO family to promote
        required: true
        type: choice
        default: dakota
        options:
          - dakota
          - utah
      release_name:
        description: Named release suffix, e.g. alpha6
        required: true
        type: string
      overwrite:
        description: Allow replacing an existing named release
        required: false
        type: boolean
        default: false

concurrency:
  group: promote-release-${{ inputs.variant }}-${{ inputs.release_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.variant }} -> ${{ inputs.release_name }}
    runs-on: ubuntu-26.04
    steps:
      - name: Validate release name
        id: names
        env:
          VARIANT: ${{ inputs.variant }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          # Reject anything that could collide with a CI-managed pointer. The
          # latest/backup objects are owned exclusively by the publish workflows.
          if [[ ! "${RELEASE_NAME}" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]; then
            echo "::error::release_name must be lowercase alphanumeric with . or - separators; got '${RELEASE_NAME}'"
            exit 1
          fi
          if [[ "${RELEASE_NAME}" == "latest" ]] || [[ "${RELEASE_NAME}" =~ ^backup-[0-9]+$ ]]; then
            echo "::error::'${RELEASE_NAME}' is a CI-managed pointer and must never be written by this workflow"
            exit 1
          fi

          {
            echo "src=${VARIANT}-live-latest.iso"
            echo "dst=${VARIANT}-live-${RELEASE_NAME}.iso"
          } >> "$GITHUB_OUTPUT"

          # Regex-escaped name of the workflow that signed the source checksum.
          case "${VARIANT}" in
            dakota) echo 'signer_re=build-iso\.yml' >> "$GITHUB_OUTPUT" ;;
            utah) echo 'signer_re=build-iso-utah\.yml' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no signing workflow known for variant '${VARIANT}'"; exit 1 ;;
          esac

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Promote objects on R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
          SRC: ${{ steps.names.outputs.src }}
          DST: ${{ steps.names.outputs.dst }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          sudo apt-get install -y rclone -qq

          FILES="$(rclone lsf R2:testing --files-only)"
          exists() { grep -Fxq "$1" <<<"$FILES"; }

          # The ISO, its checksum and the checksum's Sigstore bundle must all be
          # present, otherwise the named release would ship an ISO that cannot be
          # verified. The legacy .sig/.pem pair is copied when it exists.
          REQUIRED=("${SRC}" "${SRC}-CHECKSUM" "${SRC}-CHECKSUM.sigstore.json")
          OPTIONAL=("${SRC}-CHECKSUM.sig" "${SRC}-CHECKSUM.pem")
          for f in "${REQUIRED[@]}"; do
            if ! exists "${f}"; then
              echo "::error::source object R2:testing/${f} not found"
              exit 1
            fi
          done

          if exists "${DST}" && [[ "${OVERWRITE}" != "true" ]]; then
            echo "::error::R2:testing/${DST} already exists; re-run with overwrite=true to replace it"
            exit 1
          fi

          # ISO, checksum and signature are copied in the same step so they can
          # never drift apart. The signed checksum is copied byte-for-byte: any
          # rewrite would invalidate its signature.
          for f in "${REQUIRED[@]}" "${OPTIONAL[@]}"; do
            exists "${f}" || continue
            rclone copyto --log-level INFO --s3-no-check-bucket \
              "R2:testing/${f}" "R2:testing/${DST}${f#"${SRC}"}"
          done

      - name: Verify promoted pair
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.RCLONE_CONFIG_R2_ENDPOINT }}
          SRC: ${{ steps.names.outputs.src }}
          DST: ${{ steps.names.outputs.dst }}
          SIGNER_RE: ${{ steps.names.outputs.signer_re }}
        run: |
          set -euo pipefail

          SRC_SIZE="$(rclone size --json "R2:testing/${SRC}" | sed -E 's/.*"bytes":([0-9]+).*/\1/')"
          DST_SIZE="$(rclone size --json "R2:testing/${DST}" | sed -E 's/.*"bytes":([0-9]+).*/\1/')"
          if [[ "${SRC_SIZE}" != "${DST_SIZE}" ]]; then
            echo "::error::size mismatch: ${SRC}=${SRC_SIZE} ${DST}=${DST_SIZE}"
            exit 1
          fi

          # Verify the promoted checksum the same way a user would: against its
          # bundle and the identity of the CI workflow that signed it.
          rclone cat "R2:testing/${DST}-CHECKSUM" > /tmp/promoted-CHECKSUM
          rclone cat "R2:testing/${DST}-CHECKSUM.sigstore.json" > /tmp/promoted-CHECKSUM.sigstore.json
          cosign verify-blob \
            --bundle /tmp/promoted-CHECKSUM.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/projectbluefin/dakota-iso/\\.github/workflows/${SIGNER_RE}@refs/heads/main\$" \
            /tmp/promoted-CHECKSUM

          SRC_SUM="$(rclone cat "R2:testing/${SRC}-CHECKSUM" | awk '{print $1}')"
          DST_SUM="$(rclone cat "R2:testing/${DST}-CHECKSUM" | awk '{print $1}')"
          if [[ "${SRC_SUM}" != "${DST_SUM}" ]]; then
            echo "::error::checksum mismatch between ${SRC} and ${DST}"
            exit 1
          fi

          # The signed checksum names the latest object, so `sha256sum -c` cannot
          # run against the promoted filename. Publish the renamed line as a
          # separate, unsigned file and leave the signed checksum untouched.
          printf '%s  %s\n' "${DST_SUM}" "${DST}" > /tmp/promoted-SHA256SUMS
          rclone copyto --log-level INFO --s3-no-check-bucket \
            /tmp/promoted-SHA256SUMS "R2:testing/${DST}-SHA256SUMS"

          {
            echo "## Promoted release"
            echo
            echo "| Object | Value |"
            echo "|---|---|"
            echo "| Source | \`${SRC}\` |"
            echo "| ISO | [${DST}](https://projectbluefin.dev/${DST}) |"
            echo "| Checksum | [${DST}-CHECKSUM](https://projectbluefin.dev/${DST}-CHECKSUM) |"
            echo "| Signature | [${DST}-CHECKSUM.sigstore.json](https://projectbluefin.dev/${DST}-CHECKSUM.sigstore.json) |"
            echo "| SHA256SUMS | [${DST}-SHA256SUMS](https://projectbluefin.dev/${DST}-SHA256SUMS) |"
            echo "| SHA256 | \`${DST_SUM}\` |"
            echo "| Size | $((DST_SIZE / 1024 / 1024 / 1024)) GiB |"
          } >> "$GITHUB_STEP_SUMMARY"
