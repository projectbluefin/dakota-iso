name: enforce workflow labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    # projectbluefin/actions v1. The ref MUST be a full 40-char SHA: GitHub
    # rejects an abbreviated reusable-workflow ref before the run starts, and
    # the callee's own nested action ref has to be full-length too.
    uses: projectbluefin/actions/.github/workflows/reusable-design-enforcement.yml@ce1d0c6bb5baf8bab3a5b226e693c9fd26b3c4a8
